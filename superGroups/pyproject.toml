[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supergroups"
version = "0.1.0"
description = "Virtual musicians that learn to play together in PyTorch"
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "numpy>=1.26,<3", "mido>=1.3,<2"]

[project.scripts]
supergroups = "supergroups.cli:main"

[tool.setuptools.packages.find]
include = ["supergroups*"]
